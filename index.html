<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div id="container">
        <div id="header">
            <p class="header-text">Rock Paper Scissors Game</p>
        </div>
        <div id="game-box">
            <div id="computer-pick-div">
                <p> COMPUTER'S PICK</p>
                <div id="computer-pick"><button class="computer-btn"></button>
                </div>
            </div>
                    <div id="game-info">
                        <p id="game-info-para"> YOU WIN</p>
                    </div>
                
                <div id="user-pick">
                    <div id="user-pick-rock"><button class="user-btn"></button>
                    </div>
        
                        <div id="user-pick-paper"><button class="user-btn"></button>
                        </div>

                            <div id="user-pick-scissors"><button class="user-btn"></button>
                            </div>
                    
                             
                                

                </div>

        </div>
                <div>
                    <div id="game-score">
                    <p id="game-win">WIN = 0</p>
                    <p id="game-draw">DRAW = 0</p>
                    <p id="game-loss">LOSS = 0</p>
                </div>
            </div>
   </div>
    <script src="index.js"></script>

</body>
</html>
